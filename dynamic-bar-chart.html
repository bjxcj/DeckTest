<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECharts 动态排序柱状图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.5) 100%);
            z-index: 10;
        }

        .title {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 20px;
            background: #333333;
            color: #ffffff;
            border: 2px solid #666666;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #555555;
            border-color: #ffffff;
        }

        .btn.active {
            background: #ff6b6b;
            border-color: #ff6b6b;
        }

        .chart-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        #chart {
            width: 100%;
            height: 100%;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 180px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.05);
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
            z-index: 1;
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #666666;
            border-radius: 8px;
            padding: 15px 20px;
            color: #ffffff;
            font-size: 14px;
            z-index: 10;
            min-width: 200px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #999999;
            margin-right: 10px;
        }

        .info-value {
            color: #00ff00;
            font-weight: bold;
        }

        .status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #666666;
            font-size: 12px;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 24px;
            }

            .watermark {
                font-size: 100px;
            }

            .info-panel {
                font-size: 12px;
                padding: 10px 15px;
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">💎 销售额排序对比分析</div>
            <div class="controls">
                <button class="btn active" data-period="FY24">FY24 数据</button>
                <button class="btn" data-period="FY25">FY25 数据</button>
                <button class="btn" id="toggleAutoPlay">⏸ 暂停自动播放</button>
                <button class="btn" id="downloadPng">📥 下载 PNG</button>
            </div>
        </div>

        <div class="chart-wrapper">
            <div class="watermark" id="watermark">FY24</div>
            <div id="chart"></div>
            <div class="info-panel">
                <div class="info-item">
                    <span class="info-label">当前财年:</span>
                    <span class="info-value" id="currentPeriod">FY24</span>
                </div>
                <div class="info-item">
                    <span class="info-label">总销售额:</span>
                    <span class="info-value" id="totalSales">¥2,233.4M</span>
                </div>
                <div class="info-item">
                    <span class="info-label">面值数量:</span>
                    <span class="info-value" id="denominationCount">15</span>
                </div>
                <div class="info-item">
                    <span class="info-label">自动播放:</span>
                    <span class="info-value" id="autoPlayStatus">启用</span>
                </div>
            </div>
            <div class="status" id="status">自动播放中...</div>
        </div>
    </div>

    <script>
        // 数据定义
        const periods = ['FY24', 'FY25'];

        const fy24Data = [
            {name:'1,000元',value:765.7,percent:34.27},
            {name:'500元',value:479.8,percent:21.47},
            {name:'100元',value:284.1,percent:12.72},
            {name:'200元',value:188.6,percent:8.44},
            {name:'648元',value:112.7,percent:5.04},
            {name:'50元',value:63.6,percent:2.84},
            {name:'88元',value:34.4,percent:1.54},
            {name:'300元',value:32.2,percent:1.44},
            {name:'68元',value:25.0,percent:1.12},
            {name:'30元',value:19.3,percent:0.87},
            {name:'10元',value:18.9,percent:0.85},
            {name:'198元',value:14.0,percent:0.63},
            {name:'328元',value:13.7,percent:0.61},
            {name:'128元',value:13.1,percent:0.59},
            {name:'other',value:169.2,percent:7.57}
        ];

        const fy25Data = [
            {name:'1,000元',value:656.9,percent:33.97},
            {name:'500元',value:498.5,percent:25.7},
            {name:'100元',value:225.0,percent:11.6},
            {name:'200元',value:166.7,percent:8.62},
            {name:'50元',value:67.9,percent:3.51},
            {name:'648元',value:42.0,percent:2.17},
            {name:'300元',value:40.4,percent:2.09},
            {name:'88元',value:25.8,percent:1.33},
            {name:'68元',value:16.4,percent:0.85},
            {name:'328元',value:14.8,percent:0.76},
            {name:'198元',value:13.6,percent:0.70},
            {name:'30元',value:13.5,percent:0.70},
            {name:'128元',value:9.9,percent:0.51},
            {name:'6元',value:5.7,percent:0.29},
            {name:'other元',value:136.9,percent:7.08}
        ];

        const colorMap = {
            '6元': '#FF22BB',
            '10元': '#CC22FF',
            '30元': '#4422FF',
            '50元': '#CCFF00',
            '68元': '#00AA66',
            '100元': '#37A2DA',
            '128元': '#8822FF',
            '198元': '#0055FF',
            '200元': '#FF7700',
            '300元': '#00CCCC',
            '328元': '#00BBFF',
            '500元': '#FFDD00',
            '648元': '#00DD22',
            '1,000元': '#FF0000',
            'other': '#FF5577',
            '88元': '#32C5E9',
            '400元': '#fac858',
            '527元': '#E062AE',
            '700元': '#ff9f7f',
            'other元': '#FF5577'
        };

        const dataMap = {
            'FY24': fy24Data,
            'FY25': fy25Data
        };

        // 应用程序状态
        let currentPeriod = 'FY24';
        let autoPlayEnabled = true;
        let autoPlayInterval = null;

        // 初始化图表
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom, 'dark');

        function getChartOption(data) {
            // 排序数据
            const sortedData = [...data].sort((a, b) => b.value - a.value);

            return {
                backgroundColor: '#000000',
                title: {
                    text: '',
                    left: 'center',
                    top: 20,
                    textStyle: {
                        color: '#ffffff',
                        fontSize: 24,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: '#666666',
                    textStyle: {
                        color: '#ffffff'
                    },
                    formatter: function(params) {
                        if (params.length === 0) return '';
                        const data = params[0];
                        return `${data.value[0]}<br/>销售额: ¥${data.value[1].toFixed(1)}M<br/>占比: ${(data.value[1] / sortedData.reduce((sum, item) => sum + item.value, 0) * 100).toFixed(2)}%`;
                    }
                },
                grid: {
                    left: '3%',
                    right: '15%',
                    top: '10%',
                    bottom: '5%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    axisLabel: {
                        color: '#999999',
                        fontSize: 12
                    },
                    axisLine: {
                        lineStyle: {
                            color: '#333333'
                        }
                    },
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#222222',
                            type: 'dashed'
                        }
                    }
                },
                yAxis: {
                    type: 'category',
                    data: sortedData.map(item => item.name),
                    axisLabel: {
                        color: '#ffffff',
                        fontSize: 12,
                        overflow: 'break'
                    },
                    axisLine: {
                        lineStyle: {
                            color: '#333333'
                        }
                    },
                    splitLine: {
                        show: false
                    }
                },
                series: [
                    {
                        type: 'bar',
                        data: sortedData.map(item => ({
                            value: [item.name, item.value],
                            itemStyle: {
                                color: colorMap[item.name] || '#37A2DA'
                            }
                        })),
                        label: {
                            show: true,
                            position: 'right',
                            formatter: function(params) {
                                const dataItem = sortedData.find(item => item.name === params.value[0]);
                                return `¥${dataItem.value.toFixed(1)}M (${dataItem.percent.toFixed(2)}%)`;
                            },
                            color: '#ffffff',
                            fontSize: 11,
                            distance: 10
                        },
                        animationDuration: 1000,
                        animationEasing: 'cubicOut'
                    }
                ]
            };
        }

        function updateChart(period) {
            currentPeriod = period;
            const data = dataMap[period];

            // 更新图表
            myChart.setOption(getChartOption(data));

            // 更新水印
            document.getElementById('watermark').textContent = period;

            // 更新信息面板
            document.getElementById('currentPeriod').textContent = period;
            const totalSales = data.reduce((sum, item) => sum + item.value, 0).toFixed(1);
            document.getElementById('totalSales').textContent = `¥${totalSales}M`;
            document.getElementById('denominationCount').textContent = data.length;

            // 更新按钮状态
            document.querySelectorAll('.controls .btn[data-period]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.period === period);
            });
        }

        function startAutoPlay() {
            autoPlayEnabled = true;
            document.getElementById('autoPlayStatus').textContent = '启用';
            document.getElementById('toggleAutoPlay').textContent = '⏸ 暂停自动播放';
            document.getElementById('status').textContent = '自动播放中...';

            autoPlayInterval = setInterval(() => {
                const currentIndex = periods.indexOf(currentPeriod);
                const nextPeriod = periods[(currentIndex + 1) % periods.length];
                updateChart(nextPeriod);
            }, 5000);
        }

        function stopAutoPlay() {
            autoPlayEnabled = false;
            document.getElementById('autoPlayStatus').textContent = '禁用';
            document.getElementById('toggleAutoPlay').textContent = '▶ 开始自动播放';
            document.getElementById('status').textContent = '已暂停';
            clearInterval(autoPlayInterval);
        }

        // 事件监听
        document.querySelectorAll('.controls .btn[data-period]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const period = e.target.dataset.period;
                updateChart(period);
                stopAutoPlay();
            });
        });

        document.getElementById('toggleAutoPlay').addEventListener('click', () => {
            if (autoPlayEnabled) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        });

        document.getElementById('downloadPng').addEventListener('click', () => {
            const url = myChart.getDataURL({
                type: 'png',
                pixelRatio: 2,
                backgroundColor: '#000000'
            });
            const link = document.createElement('a');
            link.href = url;
            link.download = `销售额排序-${currentPeriod}-${new Date().getTime()}.png`;
            link.click();
        });

        // 响应式处理
        window.addEventListener('resize', () => {
            myChart.resize();
        });

        // 初始化
        updateChart('FY24');
        startAutoPlay();
    </script>
</body>
</html>
